<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f4f1e8" />

  <!-- Railway tracks -->
  <line x1="30" y1="60" x2="170" y2="60" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="140" x2="170" y2="140" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Railway ties -->
  <g fill="#8B4513">
    <rect x="35" y="70" width="8" height="60" rx="2"/>
    <rect x="55" y="70" width="8" height="60" rx="2"/>
    <rect x="75" y="70" width="8" height="60" rx="2"/>
    <rect x="95" y="70" width="8" height="60" rx="2"/>
    <rect x="115" y="70" width="8" height="60" rx="2"/>
    <rect x="135" y="70" width="8" height="60" rx="2"/>
    <rect x="155" y="70" width="8" height="60" rx="2"/>
  </g>

  <!-- Letter A in gold -->
  <g transform="translate(100, 100) scale(1.2)">
    <path d="M -25 35 L 0 -35 L 25 35 M -15 15 L 15 15" 
          stroke="#D4AF37" 
          stroke-width="8" 
          stroke-linecap="round" 
          fill="none"/>
  </g>
  
  <!-- Decorative gold elements -->
  <circle cx="40" cy="40" r="5" fill="#D4AF37"/>
  <circle cx="160" cy="40" r="5" fill="#D4AF37"/>
  <circle cx="40" cy="160" r="5" fill="#D4AF37"/>
  <circle cx="160" cy="160" r="5" fill="#D4AF37"/>
</svg>